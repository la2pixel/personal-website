      - company: Max Planck Institute for Intelligent Systems
        position: Research Assistant, Haptic Intelligence Department
        location: Stuttgart, Germany
        start_date: 2025-11
        end_date: 2026-09
        summary: "Supervisors: Dr. Vani Sundaram, Dr. Katherine Kuchenbecker"
        highlights:
          - Developed an end-to-end computer vision pipeline with high accuracy to extract contact area from single podoscope images of 36 participants from a low-cost custom acquisition setup with significant noise artifacts.
          - Processed continuous surface EMG signals across upper and lower limb muscles, isolating significant activation patterns during key phases of the gait cycle.
          - Clustering participants by self-reported perception using integrated continuous EMG, kinematics, kinetics, and biomechanical metrics.

      - company: Max Planck Institute for Intelligent Systems
        position: Research Assistant, Human Aspects of Machine Learning Lab
        location: Tübingen, Germany
        start_date: 2024-05
        end_date: 2025-10
        summary: "Supervisors: Tom Sühr, Dr. Samira Samadi"
        highlights:
          - 'Worked on the project titled "Large Language Models for Item Discovery" that automates generation of psychological test questionnaires for the most common personality dimensions.'
          - Built an LLM-based item generation pipeline across model sizes from 7B to 70B parameters, fine-tuning sentence transformers with contrastive loss ablations for item-trait classification.
          - Co-designed psychometric assessment tools across core personality constructs, achieving over 95% classification accuracy and securing a 90% item retention rate following factor analysis and reliability testing.
          - Designed large-scale human validation studies using Confirmatory Factor Analysis (CFA) and internal consistency testing to validate generated psychometric items.

      - company: Robert Bosch GmbH
        position: Data Science Intern, Controllability in Automated Driving
        location: Abstatt, Germany
        start_date: 2023-04
        end_date: 2023-09
        summary: "Supervisors: Liza Dixon, Dr. Norbert Schneider"
        highlights:
          - Developed longitudinal multilevel models for control input distributions (braking, acceleration, steering) across 18 participants and four SAE-Level 4 intervention scenarios.
          - Developed a study-specific methodology to sync multimodal sensor data with videos to accurately flag event start and end boundaries.
          - Modelled pupil diameter as a physiological arousal measure under authoritative control interventions in a driving simulation context; accepted at AutoUI 2024.

      - company: Accenture
        position: Data Analyst Intern
        location: Bangalore, India
        start_date: 2021-11
